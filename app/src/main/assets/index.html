
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAR STEEL</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    height: 100vh;
    background: #101216;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.container {
    width: 100%;
    height: 100%;
    display: flex;
    padding: 25px;
    gap: 20px;
}

.left {
    flex: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

h1 {
    color: #ff3030;
    font-size: 36px;
    letter-spacing: 5px;
    margin-bottom: 35px;
}

.controls {
    display: grid;
    grid-template-columns: repeat(3, 75px);
    grid-template-rows: repeat(3, 75px);
    gap: 12px;
}

button {
    background: #202329;
    color: white;
    border: 2px solid #ff3030;
    border-radius: 15px;
    font-size: 27px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

button:active {
    background: #ff3030;
}

.up { grid-column: 2; grid-row: 1; }
.left-btn { grid-column: 1; grid-row: 2; }
.stop { grid-column: 2; grid-row: 2; }
.right-btn { grid-column: 3; grid-row: 2; }
.down { grid-column: 2; grid-row: 3; }

.right {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-left: 2px solid #30343b;
    padding-left: 20px;
}

h2 {
    font-size: 18px;
    color: #aaa;
    letter-spacing: 3px;
}

.speed {
    font-size: 55px;
    color: #ff3030;
    font-weight: bold;
    margin: 15px;
}

.speed-buttons {
    display: flex;
    gap: 15px;
}

.speed-buttons button {
    width: 55px;
    height: 55px;
}

.connect {
    margin-top: 35px;
    width: 150px;
    height: 48px;
    font-size: 15px;
    letter-spacing: 2px;
}

.status {
    color: #aaa;
    font-size: 12px;
    margin-top: 15px;
    text-align: center;
}
</style>
</head>

<body>
<div class="container">

    <section class="left">
        <h1>CAR STEEL</h1>

        <div class="controls">
            <button class="up" onclick="send('W')">▲</button>
            <button class="left-btn" onclick="send('Q')">◀</button>
            <button class="stop" onclick="send('X')">■</button>
            <button class="right-btn" onclick="send('E')">▶</button>
            <button class="down" onclick="send('S')">▼</button>
        </div>
    </section>

    <section class="right">
        <h2>VELOCIDAD</h2>

        <div class="speed" id="speed">100</div>

        <div class="speed-buttons">
            <button onclick="changeSpeed(-10)">−</button>
            <button onclick="changeSpeed(10)">+</button>
        </div>

        <button class="connect" onclick="connectBluetooth()">
            CONECTAR
        </button>

        <div class="status" id="status">
            BLUETOOTH DESCONECTADO
        </div>
    </section>

</div>

<script>
let speed = 100;

function changeSpeed(amount) {
    speed = Math.max(0, Math.min(255, speed + amount));
    document.getElementById("speed").textContent = speed;
}

function send(command) {
    if (window.Android) {
        Android.sendCommand(command);
    }
}

function connectBluetooth() {
    if (window.Android) {
        document.getElementById("status").textContent =
            "CONECTANDO...";
        Android.connectBluetooth();
    }
}
</script>

</body>
</html>
