name: Build CAR STEEL APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Revisar archivos XML
        run: |
          find . -name "*.xml" -not -path "*/.gradle/*" -print
          python3 -c "import xml.etree.ElementTree as ET, pathlib; [ET.parse(p) for p in pathlib.Path('.').rglob('*.xml') if '.gradle' not in str(p)]; print('XML correctos')"

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace --info

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAR-STEEL-APK
          path: app/build/outputs/apk/debug/app-debug.apk